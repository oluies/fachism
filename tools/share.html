<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>share</title>
<style>
  :root{
    --plane:#0d0d0d;
    --ink:#ffffff;
    --ink2:#c3c2b7;
    --muted:#898781;
    --rule:#2c2c2a;
    --accent:#3987e5;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    width:1200px;height:630px;
    background:var(--plane);
    color:var(--ink2);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex;flex-direction:column;justify-content:center;
    padding:0 88px;
  }
  .rule{width:96px;height:6px;background:var(--accent);margin-bottom:44px}
  h1{
    margin:0 0 32px;
    color:var(--ink);
    font-size:92px;
    line-height:1.06;
    letter-spacing:-0.02em;
    font-weight:640;
    max-width:1000px;
  }
  p{
    margin:0;
    color:var(--muted);
    font-size:42px;
    line-height:1.32;
    max-width:940px;
    font-variant-numeric:tabular-nums;
  }
</style>
</head>
<body>
  <div class="rule"></div>
  <h1>Korporatismen och fascismfrågan</h1>
  <p>Systemets arkitektur 1938 till 1992, och partiernas mätbara positioner 2019 till 2024.</p>
</body>
</html>
